<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Líneas de trabajo · GCBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#153244;
    --navy-light:#1e455c;
    --teal:#8DE2D6;
    --gold:#FFCC00;
    --bg:#F5F7F7;
    --card:#FFFFFF;
    --text:#16242B;
    --muted:#6B7C82;
    --border:#E4E9EA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Montserrat',sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{background:var(--teal); color:var(--navy);}

  /* MOBILE TOP BAR */
  .mobile-top-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    background: var(--navy);
    color: #fff;
    padding: 12px 18px;
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .mobile-top-bar .m-title {
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    line-height: 1.2;
  }
  .mobile-top-bar .m-title span {
    display: block;
    font-size: 10.5px;
    color: var(--teal);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .hamburger-btn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 18px;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .sidebar-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1001;
  }
  .sidebar-overlay.open { display: block; }

  /* SIDEBAR */
  .sidebar{
    width:300px;
    min-width:300px;
    background:var(--navy);
    color:#fff;
    height:100vh;
    position:sticky;
    top:0;
    display:flex;
    flex-direction:column;
    padding:28px 0 0 0;
    z-index: 1002;
    transition: transform 0.3s ease;
  }
  .brand{
    padding:0 24px 20px 24px;
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  .brand .eyebrow{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--teal);
    font-weight:700;
    margin-bottom:6px;
  }
  .brand h1{
    font-size:19px;
    font-weight:800;
    margin:0;
    line-height:1.25;
  }
  .search-wrap{ padding:16px 24px 6px 24px; }
  .search-wrap input{
    width:100%;
    padding:10px 14px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.08);
    color:#fff;
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    outline:none;
  }
  .search-wrap input::placeholder{color:rgba(255,255,255,0.5);}
  .search-wrap input:focus{border-color:var(--teal); background:rgba(255,255,255,0.13);}

  /* DEPÓSITO AVANCES DE LA SEMANA */
  .weekly-depot{
    margin: 12px 20px;
    background: rgba(255,255,255,0.06);
    border: 1px dashed var(--teal);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .weekly-depot:hover{ background: rgba(255,255,255,0.1); }
  .weekly-depot.active{ background: rgba(141,226,214,0.15); border-style: solid; border-color: var(--teal); }
  .depot-header{ display: flex; justify-content: space-between; align-items: center; }
  .depot-title{ font-size: 12.5px; font-weight: 700; color: var(--teal); display: flex; align-items: center; gap: 6px; }
  .depot-actions { display: flex; align-items: center; gap: 8px; }
  .depot-count{ background: var(--teal); color: var(--navy); font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 10px; }
  .depot-clear-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .depot-clear-btn:hover { background: rgba(235, 87, 87, 0.8); }

  .area-list{ flex:1; overflow-y:auto; padding:4px 12px 24px 12px; }
  .area-list::-webkit-scrollbar{width:6px;}
  .area-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15); border-radius:3px;}

  .area-item{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:10px 12px 10px 10px;
    border-left:3px solid transparent;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:2px;
    transition:background .15s ease, border-color .15s ease;
  }
  .area-item:hover{background:rgba(255,255,255,0.07);}
  .area-item.active{background:rgba(255,255,255,0.09); border-left-color:var(--dot-color, var(--teal));}
  .area-item.active .area-name{color:#fff;}
  .area-row{display:flex; justify-content:space-between; align-items:center;}
  .area-name-wrap{display:flex; align-items:center; gap:8px; min-width:0;}
  .area-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; background:var(--dot-color);}
  .area-name{font-size:13.5px; font-weight:600; color:#EAF1F1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .area-count{font-size:11px; color:rgba(255,255,255,0.55); font-weight:600; flex-shrink:0;}
  .stack-bar{ display:flex; height:5px; width:100%; border-radius:3px; overflow:hidden; background:rgba(255,255,255,0.08); }
  .stack-bar span{height:100%;}
  .all-item{border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:8px; padding-bottom:14px;}

  /* MAIN */
  .main{ flex:1; padding:36px 44px 60px 44px; max-width:1220px; width:100%; }
  .topbar{ display:flex; flex-direction:column; gap:12px; margin-bottom:22px; }
  .topbar h2{ font-size:28px; font-weight:800; margin:0 0 6px 0; color:var(--navy); }
  .topbar .sub{ color:var(--muted); font-size:13.5px; font-weight:500; }

  .stats-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:26px; }
  .stat-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:8px 16px;
    cursor:pointer;
    user-select:none;
    transition:all .15s ease;
    display:flex;
    align-items:baseline;
    gap:8px;
    white-space:nowrap;
  }
  .stat-card:hover{border-color:var(--stat-color, var(--navy));}
  .stat-card .num{font-size:18px; font-weight:800; color:var(--stat-color, var(--navy)); line-height:1;}
  .stat-card .lbl{font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;}
  .stat-card.active{box-shadow:inset 0 0 0 1.5px var(--stat-color, var(--navy)); background:var(--stat-tint, var(--bg));}

  .cards{ display:grid; grid-template-columns:1fr; gap:14px; }
  .proj-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-left:5px solid var(--card-color, var(--navy));
    border-radius:12px;
    padding:18px 22px;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .proj-card:hover{box-shadow:0 6px 20px rgba(21,50,68,0.08); transform:translateY(-1px);}

  .proj-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:8px; }
  .proj-title-area { display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0; }
  .fav-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    padding: 0;
    line-height: 1;
    transition: transform 0.1s ease;
    color: #ccc;
    flex-shrink: 0;
  }
  .fav-btn:hover { transform: scale(1.2); }
  .fav-btn.is-fav { color: var(--gold); }
  
  .proj-title{font-size:15.5px; font-weight:700; color:var(--navy); line-height:1.3; word-break: break-word;}
  .badges{display:flex; gap:6px; flex-shrink:0; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  .badge{
    font-size:10.5px;
    font-weight:700;
    padding:4px 11px;
    border-radius:20px;
    white-space:nowrap;
    color:#fff;
    background:var(--badge-color, var(--navy));
  }
  .badge.hubia{background:#EFEAFB; color:#6B48D6;}
  .tags-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .internal-tag{
    font-size:10px; font-weight:700; color:var(--muted);
    background:var(--bg); border:1px solid var(--border);
    padding:3px 9px; border-radius:20px; display:inline-block;
  }
  .proj-area-tag{
    font-size:10.5px; font-weight:700;
    color:var(--tag-color, var(--muted));
    background:var(--tag-bg, var(--bg));
    border:1px solid var(--tag-border, var(--border));
    padding:3px 9px; border-radius:20px; display:inline-block;
  }
  .proj-desc{font-size:13.5px; line-height:1.6; color:#3A4A50; white-space: pre-line; word-break: break-word;}

  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-state .big{font-size:40px; margin-bottom:10px;}

  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:20px;
  }
  .toolbar input[type="text"]{
    flex:1;
    min-width:200px;
    padding:10px 14px;
    border-radius:9px;
    border:1.5px solid var(--border);
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    outline:none;
    background:#fff;
  }
  .toolbar input[type="text"]:focus{border-color:var(--navy);}
  .toolbar select{
    padding:10px 12px;
    border-radius:9px;
    border:1.5px solid var(--border);
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    background:#fff;
    color:var(--text);
    outline:none;
    cursor:pointer;
    max-width:240px;
  }
  .toolbar button{
    padding:10px 16px;
    border-radius:9px;
    border:1.5px solid var(--navy);
    background:var(--navy);
    color:#fff;
    font-family:'Montserrat',sans-serif;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:opacity .15s ease;
  }
  .toolbar button:hover{opacity:0.85;}
  .toolbar button#hubiaBtn{background:#fff; color:#6B48D6; border-color:#D9CCF5;}
  .toolbar button#hubiaBtn.active{background:#6B48D6; color:#fff; border-color:#6B48D6;}

  @media print{
    .sidebar, .toolbar, .mobile-top-bar{ display:none !important; }
    .print-header{ display:block !important; margin-bottom:16px; }
    body{display:block;}
    .main{padding:10px; max-width:100%;}
    .proj-card{ break-inside:avoid; box-shadow:none !important; }
    .stat-card{ cursor:default; box-shadow:none !important; }
    .topbar{margin-bottom:14px;}
  }
  .print-header{ display:none; font-size:11.5px; color:var(--muted); font-weight:600; }
  .print-header b{ color:var(--navy); }

  /* RESPONSIVE MEDIA QUERIES */
  @media (max-width:900px){
    body{flex-direction:column;}
    .mobile-top-bar { display: flex; }
    .sidebar {
      position: fixed;
      top: 0;
      left: -320px;
      height: 100vh;
      width: 290px;
      transition: left 0.3s ease;
      box-shadow: 4px 0 20px rgba(0,0,0,0.3);
    }
    .sidebar.open {
      left: 0;
    }
    .main {
      padding: 22px 16px 50px 16px;
    }
    .topbar h2 {
      font-size: 22px;
    }
    .stats-row {
      gap: 6px;
    }
    .stat-card {
      padding: 6px 12px;
    }
    .stat-card .num {
      font-size: 16px;
    }
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="mobile-top-bar">
  <div class="m-title">
    <span>TECBA · GCBA</span>
    Líneas de trabajo
  </div>
  <button class="hamburger-btn" id="hamburgerBtn" title="Abrir menú de áreas">☰ Menú</button>
</div>

<div class="sidebar" id="sidebar">
  <div class="brand">
    <div class="eyebrow">TECBA</div>
    <h1>Líneas de trabajo<br>con áreas del GCBA</h1>
  </div>
  
  <!-- DEPÓSITO AVANCES DE LA SEMANA -->
  <div class="weekly-depot" id="weeklyDepot" title="Filtrar proyectos favoritos guardados">
    <div class="depot-header">
      <span class="depot-title">⭐ Avances de la semana</span>
      <div class="depot-actions">
        <span class="depot-count" id="depotCount">0</span>
        <button class="depot-clear-btn" id="clearDepotBtn" title="Borrar todos los favoritos">Limpiar</button>
      </div>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" id="searchArea" placeholder="Buscar área...">
  </div>
  <div class="area-list" id="areaList"></div>
</div>

<div class="main">
  <div class="print-header" id="printHeader"></div>
  <div class="topbar">
    <div>
      <h2 id="areaTitle">Todas las áreas</h2>
      <div class="sub" id="areaSub"></div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="textSearch" placeholder="🔎 Buscar por título o descripción...">
    <select id="internaFilter">
      <option value="">Todas las áreas internas</option>
    </select>
    <button id="hubiaBtn" title="Mostrar solo líneas del Hub IA">💡 Hub IA</button>
    <button id="printBtn" title="Exportar / imprimir esta vista">🖨️ Exportar / Imprimir</button>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="cards" id="cardsContainer"></div>
</div>

<script>
const DATA = [
  {
    "area": "AGC",
    "items": [
      {
        "titulo": "Agente informativo pre-habilitación",
        "estado": "completado",
        "ia": true,
        "internas": [],
        "descripcion": "Agente informativo de requisitos y proceso del trámite de habilitación de locales comerciales. El mismo se encuentra dentro del portal de AGC\nStatus: El agente se encuentra productivo desde el 27/7, el área se encuentra en etapa de entrenamiento y seguimiento del uso."
      },
      {
        "titulo": "Agente de habilitación",
        "estado": "en_curso",
        "ia": true,
        "internas": [],
        "descripcion": "Analiza y valida la documentación presentada en los trámites de habilitación, complementando el trabajo realizado por los analistas humanos.\nStatus: El mismo se encuentra en desarrollo, la fecha prevista de salida a producción es octubre del corriente año."
      },
      {
        "titulo": "Agente de diálogo (Mesa de ayuda)",
        "estado": "completado",
        "ia": true,
        "internas": [],
        "descripcion": "Agente informativo de estado de trámites y consultas varias. El mismo se encuentra dentro del portal de AGC.\nStatus: El agente se encuentra productivo desde el 4/5. Se encuentra pendiente incorporar la funcionalidad de la voz."
      },
      {

        "internas": [
          "SSIA"
        ],
        "descripcion": "La Ley 6.009 reglamenta y requiere el registro y trazabilidad de comercios dedicados a la compra, venta y reparación de celulares usados, repuestos y partes en CABA. AGC será responsable de administrar el registro y fiscalizar los comercios, con el objetivo de prevenir la comercialización de equipos de origen ilícito. Para llevar el registro y gestión, AGC desarrollará un sistema nuevo.\nStatus: Reunión TECBA–AGC–proveedor prevista para el 31/8 o 1/9 para avanzar en el desarrollo y homologación del sistema, con fecha objetivo de puesta en producción el 19/11."
      }
    ]
  },
  {
    "area": "AGIP",
    "items": [
      {
        "titulo": "AGIP | Login miba",
        "estado": "completado",
        "ia": false,
        "internas": [
          "DGCIUD"
        ],
        "descripcion": "Se trabajó en la incorporación de login miBA en reemplazo de Clave Ciudad. Desde diciembre de 2025, se viene implementando un esquema de convivencia entre ambos sistemas.\nStatus: Está cumplido. Lo único que resta es que AGIP elimine el método de acceso con Clave Ciudad."
      },
      {

      },
      {
        "titulo": "Despapelización boletas",

        "ia": false,
        "internas": [],

      }
    ]
  },
  {
    "area": "Ambiente | Vicejefatura",

        "internas": [

        ],

      {
        "titulo": "DGGAN | Castraciones",
        "estado": "en_curso",
        "ia": false,
        "internas": [
          "DGSACIU"

        "descripcion": "El proyecto busca evolucionar el sistema de turnos para castraciones con el objetivo de mejorar la asignación de turnos y optimizar el uso de la capacidad disponible. Entre las principales mejoras propuestas se encuentran la validación de residentes de CABA, la implementación de confirmaciones previas para reducir el ausentismo, una lista de espera para reutilizar turnos liberados y mecanismos para prevenir usos indebidos, como el bloqueo de usuarios o el establecimiento de límites anuales por persona.\nStatus: DGSACIU elaboró una estimación de costos que fue remitida a Jefatura. Se estimaron para todos los requerimientos 1324 hs promedio ($46.828.556). SSCIUI va a conversar con el proveedor para validar si se puede paralelizar las tareas y evaluar la implementación para llevar info a Jefatura."

      },
      {
        "titulo": "Línea 102 - Integración 147",
        "estado": "completado",
        "ia": false,
        "internas": [
          "DGCDC"
        ],
        "descripcion": "Con el objetivo de mejorar la atención de la Línea 102, durante febrero de 2026 se implementó una articulación con la Línea 147 como filtro de primer nivel. Este esquema permite evaluar temporalidad, nivel de riesgo y factores de protección, derivando a la Línea 102 únicamente los casos de menores de edad y situaciones críticas que requieren intervención profesional (Opción 1).\nStatus: finalizado."
      },
      {
        "titulo": "Subsidios DASE en PSOC",
        "estado": "completado",

        "internas": [

  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

let currentArea = 'TODAS';
let selectedEstados = new Set();
let searchTerm = '';
let textSearchTerm = '';
let currentInterna = '';
let currentHubIA = false;
let weeklyDepotActive = false;

// Persistencia mediante localStorage
let favorites = new Set(JSON.parse(localStorage.getItem('tecba_favorites') || '[]'));

function saveFavorites() {
  localStorage.setItem('tecba_favorites', JSON.stringify(Array.from(favorites)));
}

function getItemKey(item) {
  return item.area + '::' + item.titulo;
}

function flatten(){
  let list = [];
  DATA.forEach(a=>{ a.items.forEach(i=>{ list.push({area:a.area, ...i}); }); });
  return list;
}
const ALL = flatten();

const AREA_HUES = {};
DATA.forEach((a,i)=>{ AREA_HUES[a.area] = Math.round((i*137.508)%360); });
function areaColor(name){
  const h = AREA_HUES[name] ?? 205;
  return {
    dot: `hsl(${h},68%,62%)`,
    tagBg: `hsl(${h},70%,95%)`,
    tagColor: `hsl(${h},55%,30%)`,
    tagBorder: `hsl(${h},55%,80%)`,
  };
}

function baseFilteredItems(areaName){
  let items = areaName==='TODAS' ? ALL.slice() : ALL.filter(i=>i.area===areaName);
  if(weeklyDepotActive){ items = items.filter(i=>favorites.has(getItemKey(i))); }
  if(currentInterna){ items = items.filter(i=>(i.internas||[]).includes(currentInterna)); }
  if(currentHubIA){ items = items.filter(i=>i.ia); }
  if(textSearchTerm.trim()){
    const q = textSearchTerm.trim().toLowerCase();
    items = items.filter(i=> i.titulo.toLowerCase().includes(q) || (i.descripcion||'').toLowerCase().includes(q));
  }
  return items;
}

function areaCounts(areaName){
  const items = baseFilteredItems(areaName);
  const counts = { total: items.length };
  STATUS_KEYS.forEach(k=>{ counts[k] = items.filter(i=>i.estado===k).length; });
  return counts;
}

function renderSidebar(){
  document.getElementById('depotCount').textContent = favorites.size;
  document.getElementById('weeklyDepot').classList.toggle('active', weeklyDepotActive);

  const list = document.getElementById('areaList');
  list.innerHTML = '';
  const term = searchTerm.trim().toLowerCase();

  const allC = areaCounts('TODAS');
  const allDiv = document.createElement('div');
  allDiv.className = 'area-item all-item' + ((currentArea==='TODAS' && !weeklyDepotActive) ? ' active' : '');
  allDiv.innerHTML = `
    <div class="area-row"><span class="area-name-wrap"><span class="area-name">🗂 Todas las áreas</span></span><span class="area-count">${allC.total}</span></div>
    <div class="stack-bar">${stackSegments(allC)}</div>
  `;
  allDiv.onclick = ()=>{ currentArea='TODAS'; weeklyDepotActive=false; selectedEstados.clear(); render(); closeMobileSidebar(); };
  list.appendChild(allDiv);

  DATA.filter(a => !term || a.area.toLowerCase().includes(term)).forEach(a=>{
    const c = areaCounts(a.area);
    const col = areaColor(a.area);
    const div = document.createElement('div');
    div.className = 'area-item' + ((currentArea===a.area && !weeklyDepotActive) ? ' active' : '');
    div.style.setProperty('--dot-color', col.dot);
    div.innerHTML = `
      <div class="area-row">
        <span class="area-name-wrap"><span class="area-dot" style="background:${col.dot}"></span><span class="area-name">${a.area}</span></span>
        <span class="area-count">${c.total}</span>
      </div>
      <div class="stack-bar">${stackSegments(c)}</div>
    `;
    div.onclick = ()=>{ currentArea=a.area; weeklyDepotActive=false; selectedEstados.clear(); render(); closeMobileSidebar(); };
    list.appendChild(div);
  });
}

function stackSegments(c){
  if(c.total===0) return '';
  return STATUS_KEYS.map(k=>{
    const v = c[k];
    if(!v) return '';
    const pct = (v/c.total*100).toFixed(1);
    return `<span style="width:${pct}%; background:${STATUS_META[k].color}"></span>`;
  }).join('');
}

function renderStats(){
  const c = areaCounts(currentArea);
  const row = document.getElementById('statsRow');
  let html = `<div class="stat-card ${selectedEstados.size===0?'active':''}" data-estado="todos" style="--stat-color:${'#153244'}; --stat-tint:${hexToRgba('#153244',0.08)}"><div class="num">${c.total}</div><div class="lbl">Total líneas</div></div>`;
  STATUS_KEYS.forEach(k=>{
    if(c[k]===0 && selectedEstados.size===0) return;
    const meta = STATUS_META[k];
    const active = selectedEstados.has(k);
    html += `<div class="stat-card ${active?'active':''}" data-estado="${k}" style="--stat-color:${meta.color}; --stat-tint:${hexToRgba(meta.color,0.1)}"><div class="num">${c[k]}</div><div class="lbl">${meta.label}</div></div>`;
  });
  row.innerHTML = html;
}

function renderHeader(){
  let title = currentArea==='TODAS' ? 'Todas las áreas' : currentArea;
  if(weeklyDepotActive) title = '⭐ Avances de la semana (Favoritos)';
  document.getElementById('areaTitle').textContent = title;
  const c = areaCounts(currentArea);
  document.getElementById('areaSub').textContent = `${c.total} línea${c.total===1?'':'s'} de trabajo`;
}

function renderCards(){
  let items = baseFilteredItems(currentArea);
  if(selectedEstados.size > 0){ 
    items = items.filter(i => selectedEstados.has(i.estado)); 
  }
  items.sort((a,b)=> (STATUS_META[a.estado]?.order ?? 99) - (STATUS_META[b.estado]?.order ?? 99));

  const container = document.getElementById('cardsContainer');
  if(items.length===0){
    container.innerHTML = `<div class="empty-state"><div class="big">🔎</div>No hay líneas de trabajo para este filtro.</div>`;
    return;
  }
  container.innerHTML = items.map(i => {
    const key = getItemKey(i);
    const isFav = favorites.has(key);
    const col = areaColor(i.area);
    const meta = STATUS_META[i.estado] || {label:i.estado, color:'#999'};
    const internas = i.internas || [];
    const tagsRow = ((currentArea==='TODAS' || weeklyDepotActive) || internas.length>0) ? `
      <div class="tags-row">
        ${(currentArea==='TODAS' || weeklyDepotActive) ? `<span class="proj-area-tag" style="--tag-bg:${col.tagBg}; --tag-color:${col.tagColor}; --tag-border:${col.tagBorder}">${escapeHtml(i.area)}</span>` : ''}
        ${internas.map(a=>`<span class="internal-tag">${escapeHtml(a)}</span>`).join('')}
      </div>` : '';
    return `
    <div class="proj-card" style="--card-color:${meta.color}">
      <div class="proj-head">
        <div class="proj-title-area">
          <button class="fav-btn ${isFav ? 'is-fav' : ''}" data-key="${escapeHtml(key)}" title="${isFav ? 'Quitar de avances de la semana' : 'Marcar como favorito / Avances de la semana'}">${isFav ? '★' : '☆'}</button>
          <div class="proj-title">${escapeHtml(i.titulo)}</div>
        </div>
        <div class="badges">
          ${i.ia ? '<span class="badge hubia">💡 HUB IA</span>' : ''}
          <span class="badge" style="--badge-color:${meta.color}">${meta.label}</span>
        </div>
      </div>
      ${tagsRow}
      <div class="proj-desc">${escapeHtml(i.descripcion)}</div>
    </div>
  `;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderPrintHeader(){
  const fecha = new Date().toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric'});
  const filtrosAplicados = [];
  if(selectedEstados.size > 0) filtrosAplicados.push(Array.from(selectedEstados).map(s=>STATUS_META[s]?.label).join(', '));
  if(currentInterna) filtrosAplicados.push(currentInterna);
  if(currentHubIA) filtrosAplicados.push('💡 Hub IA');
  if(weeklyDepotActive) filtrosAplicados.push('⭐ Avances de la semana');
  if(textSearchTerm.trim()) filtrosAplicados.push(`"${textSearchTerm.trim()}"`);
  const filtrosTxt = filtrosAplicados.length ? ` · Filtros: ${filtrosAplicados.join(', ')}` : '';
  document.getElementById('printHeader').innerHTML = `TECBA — Líneas de trabajo con áreas del GCBA · <b>${fecha}</b>${filtrosTxt}`;
}

function render(){
  renderSidebar();
  renderHeader();
  renderStats();
  renderCards();
  renderPrintHeader();
}

function toggleEstado(estado){
  if(estado === 'todos'){
    selectedEstados.clear();
  } else {
    if(selectedEstados.has(estado)){
      selectedEstados.delete(estado);
    } else {
      selectedEstados.add(estado);
    }
  }
  renderStats();
  renderCards();
  renderPrintHeader();
}

// Mobile sidebar drawer logic
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
const hamburgerBtn = document.getElementById('hamburgerBtn');

function toggleMobileSidebar() {
  sidebar.classList.toggle('open');
  sidebarOverlay.classList.toggle('open');
}

function closeMobileSidebar() {
  sidebar.classList.remove('open');
  sidebarOverlay.classList.remove('open');
}

hamburgerBtn.addEventListener('click', toggleMobileSidebar);
sidebarOverlay.addEventListener('click', closeMobileSidebar);

document.getElementById('weeklyDepot').addEventListener('click', (e)=>{
  if(e.target.closest('#clearDepotBtn')) return;
  weeklyDepotActive = !weeklyDepotActive;
  render();
  closeMobileSidebar();
});

document.getElementById('clearDepotBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(favorites.size === 0) return;
  if(confirm('¿Estás segura de que querés borrar todos los proyectos de "Avances de la semana"?')){
    favorites.clear();
    saveFavorites();
    weeklyDepotActive = false;
    render();
  }
});

document.getElementById('searchArea').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  renderSidebar();
});

document.getElementById('statsRow').addEventListener('click', (e)=>{
  const card = e.target.closest('.stat-card');
  if(!card) return;
  toggleEstado(card.dataset.estado);
});

document.getElementById('cardsContainer').addEventListener('click', (e)=>{
  const btn = e.target.closest('.fav-btn');
  if(!btn) return;
  const key = btn.dataset.key;
  if(favorites.has(key)){
    favorites.delete(key);
  } else {
    favorites.add(key);
  }
  saveFavorites();
  render();
});

document.getElementById('textSearch').addEventListener('input', (e)=>{
  textSearchTerm = e.target.value;
  render();
});

function populateInternaFilter(){
  const set = new Set();
  ALL.forEach(i=>(i.internas||[]).forEach(a=>set.add(a)));
  const sel = document.getElementById('internaFilter');
  Array.from(set).sort().forEach(a=>{
    const opt = document.createElement('option');
    opt.value = a;
    opt.textContent = a;
    sel.appendChild(opt);
  });
}
document.getElementById('internaFilter').addEventListener('change', (e)=>{
  currentInterna = e.target.value;
  render();
});
populateInternaFilter();

document.getElementById('hubiaBtn').addEventListener('click', (e)=>{
  currentHubIA = !currentHubIA;
  e.target.classList.toggle('active', currentHubIA);
  render();
});

document.getElementById('printBtn').addEventListener('click', ()=>{
  try{
    window.print();
  }catch(err){
    alert('El navegador bloqueó la impresión en esta vista previa.');
  }
});

render();
</script>
</body>
</html>
